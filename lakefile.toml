name = "Zeta5"
version = "0.1.0"
license = "(Apache-2.0 OR MIT)"
keywords = ["math"]
defaultTargets = ["Zeta5"]
testDriver = "Zeta5Test"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Mathlib v4.32.2 (the pin of PrimeNumberTheoremAnd) cannot configure the licence line of the header
# linter (`weak.linter.style.header.license`), so the header linter is off until the pin moves on.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "Zeta5"

[[lean_lib]]
name = "Zeta5Test"
